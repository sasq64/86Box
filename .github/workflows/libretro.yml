name: libretro core

on:
  workflow_dispatch:
  push:
    branches: [demarc]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No GUI, no host audio, and none of the optional MIDI backends: a core that
  # pulls in fewer shared libraries is a core that loads on more machines.
  CORE_CMAKE_ARGS: >-
    -G Ninja
    -D CMAKE_BUILD_TYPE=Release
    -D LIBRETRO=ON
    -D RTMIDI=OFF
    -D FLUIDSYNTH=OFF
    -D MUNT=OFF
    -D VNC=OFF

jobs:
  linux-x86_64:
    name: Linux x86_64
    # Oldest supported runner, so the core links against an older glibc and
    # stays loadable on the widest range of installs.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config file \
            libfreetype-dev libpng-dev zlib1g-dev libzstd-dev \
            libslirp-dev libsndfile1-dev

      - name: Configure
        run: cmake -S . -B build ${{ env.CORE_CMAKE_ARGS }}

      - name: Build core
        run: cmake --build build -j"$(nproc)"

      - name: Inspect core
        run: |
          file build/src/86box_libretro.so
          ls -l build/src/86box_libretro.so
          nm -D --defined-only build/src/86box_libretro.so | grep -q ' T retro_run$'
          ldd build/src/86box_libretro.so

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: 86box_libretro-linux-x86_64
          path: build/src/86box_libretro.so
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: brew install cmake ninja pkgconf freetype libpng libslirp libsndfile zstd

      # The old recompiler is x86-only; arm64 needs the new one.
      - name: Configure
        run: cmake -S . -B build ${{ env.CORE_CMAKE_ARGS }} -D NEW_DYNAREC=ON

      - name: Build core
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Inspect core
        run: |
          file build/src/86box_libretro.dylib
          ls -l build/src/86box_libretro.dylib
          nm -gU build/src/86box_libretro.dylib | grep -q '_retro_run$'
          otool -L build/src/86box_libretro.dylib

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: 86box_libretro-macos-arm64
          path: build/src/86box_libretro.dylib
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # UCRT64 is the environment 86Box's own Windows CI builds in.
      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: true
          update: true
          pacboy: >-
            cmake:p
            ninja:p
            gcc:p
            pkgconf:p
            freetype:p
            libpng:p
            zlib:p
            zstd:p
            libslirp:p
            libsndfile:p

      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build ${{ env.CORE_CMAKE_ARGS }}

      - name: Build core
        run: cmake --build build -j"$(nproc)"

      - name: Inspect core
        run: |
          file build/src/86box_libretro.dll
          ls -l build/src/86box_libretro.dll
          objdump -p build/src/86box_libretro.dll | grep -q 'retro_run'

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: 86box_libretro-windows-x64
          path: build/src/86box_libretro.dll
          if-no-files-found: error

  # Publishes the three cores to a rolling "latest" release, so the demarc app
  # can fetch them from a URL that never changes. Both of these resolve to the
  # newest successful build:
  #   https://github.com/sasq64/86Box/releases/download/latest/<asset>
  #   https://github.com/sasq64/86Box/releases/latest/download/<asset>
  # manifest.json lists each zip with its size and sha256.
  publish:
    name: Publish rolling release
    needs: [linux-x86_64, macos-arm64, windows-x64]
    if: github.ref == 'refs/heads/demarc'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Download built cores
        uses: actions/download-artifact@v8
        with:
          path: dist

      # One zip per platform, each holding the core under the plain name a
      # frontend expects, so the app can unzip straight into its cores directory.
      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release
          zip_core() {
            artifact="$1"
            core="$2"
            (cd "dist/$artifact" && zip -9 -X "$GITHUB_WORKSPACE/release/$artifact.zip" "$core")
          }
          zip_core 86box_libretro-linux-x86_64 86box_libretro.so
          zip_core 86box_libretro-macos-arm64 86box_libretro.dylib
          zip_core 86box_libretro-windows-x64 86box_libretro.dll
          ls -l release

      - name: Write manifest.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, pathlib

          version = "0.0.0"
          m = re.search(r"project\(86Box\s+VERSION\s+([0-9.]+)", pathlib.Path("CMakeLists.txt").read_text())
          if m:
              version = m.group(1)

          assets = {
              "linux-x86_64": ("86box_libretro-linux-x86_64.zip", "86box_libretro.so"),
              "macos-arm64":  ("86box_libretro-macos-arm64.zip", "86box_libretro.dylib"),
              "windows-x64":  ("86box_libretro-windows-x64.zip", "86box_libretro.dll"),
          }
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}"

          manifest = {
              "version": version,
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "cores": {},
          }
          for platform, (name, core) in assets.items():
              data = pathlib.Path("release", name).read_bytes()
              manifest["cores"][platform] = {
                  "file": name,
                  "core": core,
                  "url": f"{base}/{name}",
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }

          pathlib.Path("release/manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          cat release/manifest.json

      - name: Move the rolling tag
        run: |
          set -euo pipefail
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"

      - name: Publish release
        run: |
          set -euo pipefail
          NOTES="Rolling libretro core build from \`$GITHUB_SHA\` — see manifest.json for versions and checksums."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "libretro core (latest)" --notes "$NOTES" --latest
          else
            gh release create "$RELEASE_TAG" --title "libretro core (latest)" --notes "$NOTES" --latest
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
