name: libretro core

on:
  workflow_dispatch:
  push:
    branches: [demarc]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No GUI, no host audio, and none of the optional MIDI backends.
  CORE_CMAKE_ARGS: >-
    -G Ninja
    -D CMAKE_BUILD_TYPE=Release
    -D LIBRETRO=ON
    -D RTMIDI=OFF
    -D FLUIDSYNTH=OFF
    -D MUNT=OFF
    -D VNC=OFF
  # A core is downloaded onto machines that have none of its dependencies, so
  # on Linux and macOS vcpkg builds every one of them as a static library and
  # the core links them in. The tool is pinned here; the port versions come
  # from the registry baseline in vcpkg.json.
  VCPKG_COMMIT: e6f9e70a29a3e80a1fc510d8503304315447112f

jobs:
  linux-x86_64:
    name: Linux x86_64
    # Oldest supported runner, so the core links against an older glibc and
    # stays loadable on the widest range of installs.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      VCPKG_TRIPLET: x64-linux-pic
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config file \
            curl zip unzip tar autoconf automake libtool python3

      - name: Restore cached vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ env.VCPKG_TRIPLET }}-

      - name: Set up vcpkg
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      # --as-needed drops the libatomic libslirp's .pc asks for but nothing
      # references; the two -static- flags fold in the GCC runtime.
      - name: Configure
        id: configure
        run: >-
          cmake -S . -B build ${{ env.CORE_CMAKE_ARGS }}
          -D CMAKE_MODULE_LINKER_FLAGS="-Wl,--as-needed -static-libgcc -static-libstdc++"
          -D CMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -D VCPKG_OVERLAY_TRIPLETS=cmake/vcpkg-triplets
          -D VCPKG_TARGET_TRIPLET=${{ env.VCPKG_TRIPLET }}

      # Saved here rather than by actions/cache's combined form, whose post
      # step only runs on success: a failure further down used to throw away
      # the whole dependency build.
      - name: Save vcpkg packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/vcpkg/archives
          # A configure that died half-way leaves an incomplete set, which
          # must not claim the primary key: the next run would hit it and
          # never save the complete one.
          key: ${{ steps.configure.outcome == 'success'
            && steps.vcpkg-cache.outputs.cache-primary-key
            || format('{0}-partial-{1}', steps.vcpkg-cache.outputs.cache-primary-key, github.run_id) }}

      - name: Build core
        run: cmake --build build -j"$(nproc)"

      - name: Inspect core
        run: |
          set -euo pipefail
          core=build/src/86box_libretro.so
          file "$core"
          ls -l "$core"
          # Nothing pipes into grep -q: the writer would be killed by SIGPIPE
          # and pipefail would report that as a failed step.
          syms=$(nm -D --defined-only "$core")
          grep -q ' T retro_run$' <<<"$syms"
          needed=$(readelf -d "$core" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p')
          echo "$needed"
          # Anything outside glibc means a dependency slipped back out of the
          # static link and the core would fail to load on a bare machine.
          bad=$(grep -vE '^(libc\.so\.6|libm\.so\.6|libdl\.so\.2|librt\.so\.1|libpthread\.so\.0|ld-linux-x86-64\.so\.2)$' <<<"$needed" || true)
          if [ -n "$bad" ]; then
            echo "::error::core links a non-system library: $(tr '\n' ' ' <<<"$bad")"
            exit 1
          fi

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: 86box_libretro-linux-x86_64
          path: build/src/86box_libretro.so
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      VCPKG_TRIPLET: arm64-osx-pic
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: brew install cmake ninja pkgconf autoconf automake libtool

      - name: Restore cached vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ env.VCPKG_TRIPLET }}-

      - name: Set up vcpkg
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      # The old recompiler is x86-only; arm64 needs the new one.
      - name: Configure
        id: configure
        run: >-
          cmake -S . -B build ${{ env.CORE_CMAKE_ARGS }}
          -D NEW_DYNAREC=ON
          -D CMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -D VCPKG_OVERLAY_TRIPLETS=cmake/vcpkg-triplets
          -D VCPKG_TARGET_TRIPLET=${{ env.VCPKG_TRIPLET }}

      # Saved here rather than by actions/cache's combined form, whose post
      # step only runs on success: a failure further down used to throw away
      # the whole dependency build.
      - name: Save vcpkg packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/vcpkg/archives
          # A configure that died half-way leaves an incomplete set, which
          # must not claim the primary key: the next run would hit it and
          # never save the complete one.
          key: ${{ steps.configure.outcome == 'success'
            && steps.vcpkg-cache.outputs.cache-primary-key
            || format('{0}-partial-{1}', steps.vcpkg-cache.outputs.cache-primary-key, github.run_id) }}

      - name: Build core
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Inspect core
        run: |
          set -euo pipefail
          core=build/src/86box_libretro.dylib
          file "$core"
          ls -l "$core"
          # Apple's nm turns the SIGPIPE from grep -q into a hard error, so it
          # writes to a variable instead of a pipe.
          syms=$(nm -gU "$core")
          grep -q '_retro_run$' <<<"$syms"
          libs=$(otool -L "$core" | tail -n +2 | awk '{print $1}')
          echo "$libs"
          # Only OS libraries and frameworks may remain.
          bad=$(grep -v '86box_libretro' <<<"$libs" \
            | grep -vE '^(/usr/lib/|/System/Library/Frameworks/)' || true)
          if [ -n "$bad" ]; then
            echo "::error::core links a non-system library: $(tr '\n' ' ' <<<"$bad")"
            exit 1
          fi

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: 86box_libretro-macos-arm64
          path: build/src/86box_libretro.dylib
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # UCRT64 is the environment 86Box's own Windows CI builds in, and its
      # STATIC_BUILD default already links the MinGW runtime and every
      # dependency in.
      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: true
          update: true
          pacboy: >-
            cmake:p
            ninja:p
            gcc:p
            pkgconf:p
            freetype:p
            libpng:p
            zlib:p
            zstd:p
            libslirp:p
            libsndfile:p

      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build ${{ env.CORE_CMAKE_ARGS }}

      - name: Build core
        run: cmake --build build -j"$(nproc)"

      - name: Inspect core
        run: |
          set -euo pipefail
          core=build/src/86box_libretro.dll
          file "$core"
          ls -l "$core"
          headers=$(objdump -p "$core")
          grep -q 'retro_run' <<<"$headers"
          dlls=$(sed -n 's/^\tDLL Name: //p' <<<"$headers" | sort -u)
          echo "$dlls"
          # Nothing from the MSYS2 prefix may be imported: those DLLs are not
          # on the machine the core is downloaded to.
          bad=$(grep -iE '^(lib|SDL|zlib|sndfile|slirp|glib)' <<<"$dlls" || true)
          if [ -n "$bad" ]; then
            echo "::error::core imports a non-system DLL: $(tr '\n' ' ' <<<"$bad")"
            exit 1
          fi

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: 86box_libretro-windows-x64
          path: build/src/86box_libretro.dll
          if-no-files-found: error

  # Publishes the three cores to a rolling "latest" release, so the demarc app
  # can fetch them from a URL that never changes. Both of these resolve to the
  # newest successful build:
  #   https://github.com/sasq64/86Box/releases/download/latest/<asset>
  #   https://github.com/sasq64/86Box/releases/latest/download/<asset>
  # manifest.json lists each zip with its size and sha256.
  publish:
    name: Publish rolling release
    needs: [linux-x86_64, macos-arm64, windows-x64]
    if: github.ref == 'refs/heads/demarc'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Download built cores
        uses: actions/download-artifact@v8
        with:
          path: dist

      # One zip per platform, each holding the core under the plain name a
      # frontend expects, so the app can unzip straight into its cores directory.
      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release
          zip_core() {
            artifact="$1"
            core="$2"
            (cd "dist/$artifact" && zip -9 -X "$GITHUB_WORKSPACE/release/$artifact.zip" "$core")
          }
          zip_core 86box_libretro-linux-x86_64 86box_libretro.so
          zip_core 86box_libretro-macos-arm64 86box_libretro.dylib
          zip_core 86box_libretro-windows-x64 86box_libretro.dll
          ls -l release

      - name: Write manifest.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, pathlib

          version = "0.0.0"
          m = re.search(r"project\(86Box\s+VERSION\s+([0-9.]+)", pathlib.Path("CMakeLists.txt").read_text())
          if m:
              version = m.group(1)

          assets = {
              "linux-x86_64": ("86box_libretro-linux-x86_64.zip", "86box_libretro.so"),
              "macos-arm64":  ("86box_libretro-macos-arm64.zip", "86box_libretro.dylib"),
              "windows-x64":  ("86box_libretro-windows-x64.zip", "86box_libretro.dll"),
          }
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}"

          manifest = {
              "version": version,
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "cores": {},
          }
          for platform, (name, core) in assets.items():
              data = pathlib.Path("release", name).read_bytes()
              manifest["cores"][platform] = {
                  "file": name,
                  "core": core,
                  "url": f"{base}/{name}",
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }

          pathlib.Path("release/manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          cat release/manifest.json

      - name: Move the rolling tag
        run: |
          set -euo pipefail
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"

      - name: Publish release
        run: |
          set -euo pipefail
          NOTES="Rolling libretro core build from \`$GITHUB_SHA\` — see manifest.json for versions and checksums."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "libretro core (latest)" --notes "$NOTES" --latest
          else
            gh release create "$RELEASE_TAG" --title "libretro core (latest)" --notes "$NOTES" --latest
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
